[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankicli"
dynamic = ["version"]
description = "Anki's own engine as a fast headless server and command-line tool: a drop-in replacement for AnkiConnect (legacy and v1 APIs), without Anki Desktop."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Macro002" }]
keywords = ["anki", "ankiconnect", "flashcards", "spaced-repetition", "headless", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = ["anki>=25.9,<27"]

[project.optional-dependencies]
tui = ["textual>=1.0"]
test = ["pytest>=8", "jsonschema>=4.20", "textual>=1.0"]

[project.urls]
Homepage = "https://github.com/Macro002/anki-cli"
Issues = "https://github.com/Macro002/anki-cli/issues"

[project.scripts]
anki-cli = "ankicli.cli:main"
ankicli = "ankicli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ankicli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ankicli.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/compat"
filterwarnings = ["ignore::DeprecationWarning"]
